<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RME Klinik Imanuel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="shell">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="mark" id="brandMark">KI</div>
      <div class="txt" id="brandTeks">Klinik Imanuel<small>Rekam Medis</small></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">
      <div class="sidebar-user">
        <div class="avatar" id="userAvatar">?</div>
        <div class="who flex-1">
          <b id="userNama">Memuat…</b>
          <span id="userPeran"></span>
        </div>
        <button class="btn-icon" id="btnKeluar" title="Keluar"
                style="background:transparent;border-color:rgba(255,255,255,.18);color:#C6E6E1"></button>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="btn-icon menu-toggle" id="btnMenu" aria-label="Menu"></button>
      <div class="page-title" id="judulHalaman">Beranda</div>
      <div class="spacer"></div>
      <div class="today" id="tanggalHariIni"></div>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/ui.js"></script>
<script src="js/db.js"></script>
<script src="js/komponen.js"></script>
<script src="js/odontogram.js"></script>
<!-- Modul apotek & kasir. Tiga berkas pertama adalah fungsi murni:
     tidak menyentuh DOM, tidak memanggil Supabase, dan bisa diuji dengan
     `node test/uji_apotek_core.js` maupun `node test/uji_struk_core.js`.
     pdfmake TIDAK dimuat di sini — kasir.js mengambilnya saat pertama kali
     kwitansi PDF dibuat, supaya halaman lain tidak menunggu 1,5 MB font. -->
<script src="js/apotek_core.js"></script>
<script src="js/apotek_excel.js"></script>
<script src="js/struk_core.js"></script>
<script src="js/struk_printer.js"></script>
<script src="js/invoice_template.js"></script>
<script src="js/lab_core.js"></script>
<script src="js/periksa_core.js"></script>
<script src="js/antrean_core.js"></script>
<script src="js/kronis_core.js"></script>
<script src="js/kronis_pantau_core.js"></script>
<script src="js/laporan_core.js"></script>
<!-- Modul surat. kop_klinik.js berisi gambar kop sebagai data URI —
     dimuat di sini, bukan diambil saat dibutuhkan, karena halaman cetak
     dan pdfmake dua-duanya butuh gambarnya ADA saat itu juga; kop yang
     baru selesai diunduh setelah dialog cetak terbuka menghasilkan surat
     tanpa kop. surat_core.js murni: bisa diuji dengan
     `node test/uji_surat_core.js`. -->
<script src="js/kop_klinik.js"></script>
<script src="js/surat_core.js"></script>
<script src="js/surat_cetak.js"></script>
<script src="js/pages/beranda.js"></script>
<script src="js/pages/pendaftaran.js"></script>
<script src="js/pages/antrian.js"></script>
<script src="js/pages/pasien.js"></script>
<script src="js/pages/kajian.js"></script>
<script src="js/pages/periksa.js"></script>
<script src="js/pages/rekam.js"></script>
<script src="js/pages/laporan.js"></script>
<script src="js/pages/apotek.js"></script>
<script src="js/pages/kasir.js"></script>
<script src="js/pages/tarif.js"></script>
<script src="js/pages/jadwal.js"></script>
<script src="js/pages/migrasi.js"></script>
<script src="js/pages/pantau_kronis.js"></script>
<script src="js/pages/master.js"></script>
<script src="js/pages/lab.js"></script>
<script src="js/pages/surat.js"></script>
<script src="js/pages/pengaturan.js"></script>
<script src="js/app.js"></script>
</body>
</html>
