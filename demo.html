<link rel="preconnect" href="https://fonts.googleapis.com">

<div class="shell">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="mark" id="brandMark">KI</div>
      <div class="txt" id="brandTeks">Klinik Imanuel<small>Rekam Medis</small></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">
      <div class="sidebar-user">
        <div class="avatar" id="userAvatar">?</div>
        <div class="who flex-1">
          <b id="userNama">Memuat…</b>
          <span id="userPeran"></span>
        </div>
        <button class="btn-icon" id="btnKeluar" title="Keluar"
                style="background:transparent;border-color:rgba(255,255,255,.18);color:#C6E6E1"></button>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="btn-icon menu-toggle" id="btnMenu" aria-label="Menu"></button>
      <div class="page-title" id="judulHalaman">Beranda</div>
      <div class="spacer"></div>
      <div class="today" id="tanggalHariIni"></div>
    </header>
    <div class="demo-banner">
      <span><b>Mode demo</b> — data di halaman ini hanya contoh dan tidak tersimpan.
      Semua nama pasien fiktif.</span>
      <label>Lihat sebagai: <select id="peranDemo"></select></label>
    </div>
    <main class="content" id="view"></main>
  </div>
</div>

<script src="js/config.js"></script>

  CONFIG.SUPABASE_URL = 'demo://lokal'; CONFIG.SUPABASE_ANON_KEY = 'demo';</script>

<script>
/* Pemilih peran khusus halaman demo */
document.addEventListener('DOMContentLoaded', () => {
  const sel = document.getElementById('peranDemo');
  if (!sel || !DB.PERAN_DEMO) return;
  const kini = DB.peranDemoSekarang();
  sel.innerHTML = Object.keys(DB.PERAN_DEMO)
    .map(k => `<option value="${k}" ${k === kini ? 'selected' : ''}>${k}</option>`).join('');
  sel.addEventListener('change', () => DB.gantiPeranDemo(sel.value));
});
</script>
</body>
